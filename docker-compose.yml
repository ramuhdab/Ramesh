version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spqr
      POSTGRES_PASSWORD: spqr_dev_password
      POSTGRES_DB: spqr_inventory
    ports:
      - "5432:5432"
    volumes:
      - spqr_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://spqr:spqr_dev_password@db:5432/spqr_inventory
      JWT_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:5173
      MAIL_PROVIDER: console
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      # Attachments (WF30) and import error data live on local disk by
      # default (storage.adapter.ts) - a named volume keeps them across
      # container restarts/rebuilds. Swap STORAGE_PROVIDER for a managed
      # object-storage adapter in production (see deployment/06 and 07,
      # "Object Storage") where this volume would not apply anyway.
      - spqr_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  spqr_db_data:
  spqr_uploads:
