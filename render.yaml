# Render Blueprint - free-tier deployment for testing (see
# deployment/08-Deployment-Render.md for the full step-by-step guide).
#
# Rename the two `name:` values below to something globally unique on Render
# (service names share a single *.onrender.com namespace across all Render
# users) before deploying, then follow deployment/08-Deployment-Render.md
# starting at Step 1 - it explains the two `sync: false` values below and
# exactly what to enter for them during the Blueprint creation wizard.

databases:
  - name: spqr-inventory-db
    plan: free
    databaseName: spqr_inventory
    user: spqr

services:
  - type: web
    name: spqr-inventory-backend
    runtime: node
    rootDir: backend
    plan: free
    healthCheckPath: /health
    # No Docker - Render builds and runs this directly with its own Node
    # runtime. `buildCommand`/`startCommand` are relative to `rootDir` above,
    # so these are the same commands you'd run by hand from inside backend/.
    # `--include=dev` is required here: with NODE_ENV=production set below,
    # plain `npm install` silently skips devDependencies - which is where
    # typescript, the prisma CLI, and tsx all live, breaking both this build
    # (tsc/prisma not found) and the seed step in startCommand (tsx not
    # found). Render keeps the same filesystem from build through to start
    # for native (non-Docker) services, so installing them here is enough
    # for both.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # `preDeployCommand`/`initialDeployHook` are paid-plan-only on Render (they
    # error with "not supported for free tier services"), so on the free plan
    # schema sync and seeding instead run as part of the start command, every
    # deploy. This repo has no backend/prisma/migrations directory (no
    # migration was ever generated against a real database), so `prisma
    # migrate deploy` would silently apply nothing and leave the database
    # empty - `prisma db push` is used instead, which reconciles the database
    # directly against schema.prisma with no migration history required.
    # `--accept-data-loss` avoids an interactive prompt that would otherwise
    # hang a non-interactive deploy (safe here: this is a disposable test
    # database, never a real migration path - see Section 5 of the guide).
    # prisma/seed.ts upserts the permission catalog and skips creating the
    # Super Admin if one already exists, so re-running it every deploy is
    # harmless. The seed script's one-time output (the generated Super Admin
    # temp password, on the very first deploy only) appears in this service's
    # Logs tab - see deployment/08-Deployment-Render.md Step 4.
    startCommand: sh -c "npx prisma db push --accept-data-loss --skip-generate && npm run prisma:seed && node dist/server.js"
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spqr-inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MAIL_PROVIDER
        value: console
      - key: STORAGE_PROVIDER
        value: local
      # Without this, prisma/seed.ts falls back to a fixed, publicly-known
      # default password ("ChangeMe!2026") for the Sparquer Super Admin -
      # fine for a first deploy (the app forces a password change on first
      # login), but anyone who reads this file could log in first. Set your
      # own value here instead. Only takes effect when the super_admins
      # table is empty (fresh DB, or after deleting the existing row) -
      # prisma/seed.ts skips creating one if it already exists.
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      # `sync: false` means Render prompts you for this value during Blueprint
      # creation, rather than baking a value into this file. Since the
      # frontend service's name (below) determines its URL deterministically
      # (https://<name>.onrender.com), you already know the right value to
      # enter *before* either service has actually been deployed - see
      # deployment/08-Deployment-Render.md Steps 1-2.
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: spqr-inventory-frontend
    runtime: static
    rootDir: frontend
    # `--include=dev` for the same reason as the backend above: vite and
    # typescript (which this build needs) are devDependencies.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    # No `plan:` here - static sites don't take one (they're always served
    # free off Render's CDN, with no configurable instance size).
    envVars:
      # See the CORS_ORIGIN comment above - same idea, in reverse: enter
      # https://<your-backend-name>.onrender.com/api/v1 when prompted. This
      # is baked into the static build, so changing it later needs a redeploy.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
