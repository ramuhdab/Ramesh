server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # In docker-compose, "backend" resolves to the backend service by name.
    # If serving this build somewhere the backend has a different address,
    # override this proxy_pass (or terminate /api at a load balancer instead).
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
