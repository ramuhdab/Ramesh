# Railway config-as-code for the backend service - see
# deployment/09-Deployment-Railway.md for the full step-by-step guide.
#
# Unlike Render's render.yaml, Railway's config-as-code file does NOT declare
# services, databases, or environment variables - those are set up manually
# per-service in the Railway Dashboard (or via `railway variables set`). This
# file only covers the build/deploy settings for the backend service, and
# Railway needs to be told where to find it: when creating this service,
# set its "Root Directory" to `backend` in Settings, AND separately set its
# "Config-as-code Path" to `backend/railway.toml` (Root Directory does NOT
# make Railway look for the config file inside that folder automatically).
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
# `--include=dev` matters here for the same reason it did on Render: this
# build needs TypeScript, the Prisma CLI, and tsx, which are all
# devDependencies, and some build environments skip those when NODE_ENV is
# production.
buildCommand = "npm install --include=dev && npx prisma generate && npm run build"

[deploy]
startCommand = "node dist/server.js"
# Unlike Render's free tier, Railway's preDeployCommand isn't plan-gated, so
# it's used here directly (no need to fold this into the start command).
# Runs after the build, before startCommand, against the live DATABASE_URL.
# This repo has no backend/prisma/migrations directory (never generated
# against a real database), so `prisma db push` is used instead of
# `migrate deploy` - it reconciles the database directly against
# schema.prisma with no migration history required. `--accept-data-loss`
# avoids an interactive prompt that would otherwise hang a non-interactive
# deploy (safe here: disposable test database, not a real migration path).
# Both commands are idempotent: `db push` just re-confirms an already-matching
# schema, and prisma/seed.ts skips creating the Super Admin if one already
# exists (see prisma/seed.ts for the SEED_SUPER_ADMIN_PASSWORD reset path).
# Railway's `preDeployCommand` array accepts at most one element - unlike
# Render's shell-wrapped startCommand, this can't just be `&&`-chained into
# multiple array entries, so both steps are chained inside one shell command.
preDeployCommand = ["sh -c \"npx prisma db push --accept-data-loss --skip-generate && npm run prisma:seed\""]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
